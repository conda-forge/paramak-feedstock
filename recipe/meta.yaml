{% set name = "paramak" %}
{% set version = "0.11.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/paramak-{{ version }}.tar.gz
  sha256: ba048fa526ae1ca5c51f24dfb5ed92576f5459dd2be2d1fae95cf97eba5e90e8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=72.1.0
    - setuptools-scm >=8.1.0
    - pip
  run:
    - python >={{ python_min }}
    - cadquery >=2.5.2
    - numpy
    - mpmath
    - sympy
    - scipy

test:
  imports:
    - paramak
  requires:
    - python {{ python_min }}
    - pip
    - pytest
  source_files:
    - tests
  commands:
    - pytest tests

about:
  home: https://github.com/fusion-energy/paramak
  summary: Create 3D fusion reactor CAD models based on input parameters
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shimwell
